spring.application.name=cinematower

# Secrets locaux lus depuis .env (ignoré par Git, CLAUDE.md §5.1), au format
# properties : CLE=valeur, sans guillemets. Chemin relatif au répertoire de
# lancement (ce dossier, CineTower/). « optional: » : ailleurs qu'en local, les
# mêmes clés peuvent venir de variables d'environnement.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/cinematower
# Sans valeur par défaut : une clé absente fait échouer le démarrage, bruyamment.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
